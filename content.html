{% extends "base.html" %}
{% block title %}Content{% endblock %}
{% block slide %}
<div class="slide aspect-[4/5] w-full max-w-lg p-8 flex items-center justify-center dark:text-white bg-gradient-to-tr from-white via-zinc-50 to-zinc-200 dark:from-zinc-950 dark:via-zinc-900 dark:to-zinc-800 shadow-lg">
    <div class="h-full flex flex-col items-center">
        <div class="h-10 flex items-center gap-4">
            <div class="aspect-square h-full">
                <img src="https://s3.us-east-1.amazonaws.com/s3.scripts.alexandreafonso.com.br/public/temp/assets/alexandre.png" class="rounded-full border-2 border-sky-600" />
            </div>

            <div class="flex-1 flex flex-col gap-2 text-sky-600">
                <div class="text-lg">@xandreafonso</div>
            </div>
        </div>

        <div class="flex-1 p-4 flex items-center justify-center">
            <!-- INÍCIO TEXTO CONTENT -->
            {{ content | safe }}
            <!-- FIM TEXTO CONTENT -->
        </div>
    </div>
</div>
{% endblock %}
